syntax = "proto3";

package OptionalPractice;

service OptionalPractice {
	rpc selectEnum (OptionalRequest) returns (OptionalResponse);
}

message ClientComment {
	string comment = 1;
}

message OptionalRequest {
	optional ClientComment comment = 1;
	int32 point = 2;
}

message OptionalResponse {
	string comment = 1;
}