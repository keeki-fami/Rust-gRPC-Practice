syntax = "proto3";

package OptionalPractice;

service OptionalPractice {
	rpc JudgeHello (OptionalRequest) returns (OptionalResponse);
}

message ServerComment {
	string comment = 1;
}

message OptionalRequest {
	string hello = 1;
}

message OptionalResponse {
	ServerComment comment = 1;
	optional int32 point = 2;
}